<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>LearnLoop — Sprint-Based Learning</title>
<meta name="description" content="Break any skill into a 7-day sprint of time-boxed, cognitively-sized learning blocks." />
<meta name="theme-color" content="#181A26" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181A26;
    --ink-soft:#20233490;
    --ink-card:#22253A;
    --ink-card-solid:#22253A;
    --paper:#EDE7DA;
    --paper-dim:#B8B3A6;
    --line:rgba(237,231,218,0.10);
    --line-strong:rgba(237,231,218,0.20);

    --dawn:#E8845F;   /* Morning */
    --gold:#D9A441;   /* Afternoon */
    --dusk:#8E78B8;   /* Evening */
    --night:#5E72B5;  /* Night */

    --danger:#D9665B;
    --ok:#7FB88A;

    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;

    --shadow-glass: 0 8px 32px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 800px at 15% -10%, #2A2E46 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #241F35 0%, transparent 55%),
      var(--ink);
    color:var(--paper);
    font-family:'Public Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .mono{ font-family:'Space Mono', monospace; }

  button{ font-family:inherit; }
  ::selection{ background:var(--gold); color:var(--ink); }

  /* ---------- App shell (flex per spec) ---------- */
  .app-container{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    max-width:560px;
    margin:0 auto;
    position:relative;
  }
  .main-content{
    flex:1;
    display:flex;
    flex-direction:column;
    padding-bottom:92px;
    min-height:0;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:20px 20px 14px;
    position:sticky;
    top:0;
    z-index:20;
    background:linear-gradient(180deg, var(--ink) 60%, rgba(24,26,38,0));
  }
  .topbar .goal-block{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }
  .topbar .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--paper-dim);
  }
  .topbar h1{
    font-size:20px;
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .icon-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:40px;
    height:40px;
    border-radius:50%;
    background:rgba(237,231,218,0.06);
    border:1px solid var(--line);
    color:var(--paper);
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:active{ background:rgba(237,231,218,0.14); }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:16px;
    width:calc(100% - 32px);
    max-width:528px;
    display:flex;
    flex-direction:row;
    background:rgba(34,37,58,0.85);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--line-strong);
    border-radius:20px;
    padding:8px;
    gap:6px;
    box-shadow:var(--shadow-glass);
    z-index:30;
  }
  .nav-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    padding:9px 4px;
    border-radius:14px;
    background:transparent;
    border:none;
    color:var(--paper-dim);
    cursor:pointer;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.02em;
  }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn.active{
    background:rgba(217,164,65,0.14);
    color:var(--gold);
  }

  /* ---------- Glass card ---------- */
  .glass{
    background:rgba(237,231,218,0.045);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-glass);
  }

  .section{
    padding:0 20px 20px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px 20px;
    border-radius:14px;
    border:1px solid var(--line-strong);
    background:rgba(237,231,218,0.06);
    color:var(--paper);
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{
    background:linear-gradient(135deg, var(--gold), var(--dawn));
    color:#181A26;
    border:none;
  }
  .btn-block{ width:100%; }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--paper-dim);
  }
  .btn-danger{
    background:rgba(217,102,91,0.14);
    border:1px solid rgba(217,102,91,0.4);
    color:#F0A79E;
  }
  .btn-sm{ padding:8px 14px; font-size:13px; border-radius:10px; }

  /* ---------- Onboarding ---------- */
  .onboarding{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:32px 24px;
    gap:28px;
  }
  .onboarding .mark{
    display:flex;
    justify-content:center;
  }
  .onboarding h1{
    font-size:34px;
    text-align:center;
    line-height:1.15;
    margin:0;
  }
  .onboarding .sub{
    text-align:center;
    color:var(--paper-dim);
    font-size:14px;
    line-height:1.5;
    margin:0;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .field label{
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--paper-dim);
    font-family:'Space Mono', monospace;
  }
  input[type=text], textarea{
    background:rgba(237,231,218,0.06);
    border:1px solid var(--line-strong);
    border-radius:12px;
    padding:14px 16px;
    color:var(--paper);
    font-size:16px;
    font-family:inherit;
    outline:none;
  }
  input[type=text]:focus, textarea:focus{
    border-color:var(--gold);
  }
  .duration-row{
    display:flex;
    flex-direction:row;
    gap:8px;
    justify-content:space-between;
  }
  .duration-chip{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:10px 0;
    border-radius:12px;
    border:1px solid var(--line-strong);
    background:rgba(237,231,218,0.04);
    color:var(--paper-dim);
    cursor:pointer;
    font-weight:700;
  }
  .duration-chip .n{ font-family:'Space Mono', monospace; font-size:16px; }
  .duration-chip.selected{
    background:rgba(217,164,65,0.16);
    border-color:var(--gold);
    color:var(--gold);
  }

  /* ---------- Capacity ring (signature element) ---------- */
  .ring-wrap{ position:relative; display:flex; align-items:center; justify-content:center; }
  .ring-wrap .ring-center{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    line-height:1;
  }
  .ring-center .val{ font-family:'Space Mono', monospace; font-weight:700; }
  .ring-center .lbl{ color:var(--paper-dim); text-transform:uppercase; letter-spacing:0.08em; }

  /* ---------- Task card ---------- */
  .task-card{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:14px 14px;
    border-radius:var(--radius-md);
    background:rgba(237,231,218,0.045);
    border:1px solid var(--line);
    cursor:pointer;
  }
  .task-card:active{ background:rgba(237,231,218,0.08); }
  .task-card .task-main{
    display:flex;
    flex-direction:column;
    gap:5px;
    min-width:0;
  }
  .task-card .task-title{
    font-size:14.5px;
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .task-card.completed .task-title{
    text-decoration:line-through;
    color:var(--paper-dim);
  }
  .tag-row{ display:flex; flex-direction:row; gap:6px; align-items:center; }
  .tag{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:3px 7px;
    border-radius:6px;
  }
  .tag-primary{ background:rgba(232,132,95,0.18); color:var(--dawn); }
  .tag-secondary{ background:rgba(94,114,181,0.2); color:#9FB0E8; }
  .tag-size{
    background:rgba(237,231,218,0.08);
    color:var(--paper-dim);
    font-family:'Space Mono', monospace;
  }
  .task-actions{ flex-shrink:0; }

  .empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding:36px 20px;
    color:var(--paper-dim);
    text-align:center;
  }
  .empty-state .glyph{ font-size:28px; opacity:0.6; }
  .empty-state .t{ font-weight:600; color:var(--paper); }
  .empty-state .s{ font-size:13px; max-width:260px; }

  /* ---------- Backlog form ---------- */
  .task-form{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:16px;
  }
  .toggle-row{
    display:flex;
    flex-direction:row;
    gap:8px;
  }
  .toggle-btn{
    flex:1;
    padding:10px 0;
    text-align:center;
    border-radius:10px;
    border:1px solid var(--line-strong);
    background:rgba(237,231,218,0.04);
    color:var(--paper-dim);
    cursor:pointer;
    font-size:13px;
    font-weight:700;
  }
  .toggle-btn.selected.primary{ background:rgba(232,132,95,0.16); border-color:var(--dawn); color:var(--dawn); }
  .toggle-btn.selected.secondary{ background:rgba(94,114,181,0.2); border-color:#5E72B5; color:#9FB0E8; }
  .size-row{ display:flex; flex-direction:row; justify-content:space-between; gap:8px; }
  .size-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 0;
    border-radius:10px;
    border:1px solid var(--line-strong);
    background:rgba(237,231,218,0.04);
    color:var(--paper-dim);
    cursor:pointer;
  }
  .size-btn .n{ font-family:'Space Mono', monospace; font-weight:700; font-size:14px; }
  .size-btn .u{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; }
  .size-btn.selected{ background:rgba(217,164,65,0.16); border-color:var(--gold); color:var(--gold); }

  /* ---------- Planner ---------- */
  .view-toggle{
    display:flex;
    flex-direction:row;
    gap:6px;
    padding:0 20px;
  }
  .view-chip{
    padding:7px 14px;
    border-radius:10px;
    border:1px solid var(--line-strong);
    background:rgba(237,231,218,0.04);
    color:var(--paper-dim);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .view-chip.selected{ background:rgba(217,164,65,0.16); border-color:var(--gold); color:var(--gold); }

  .schedule-canvas{
    display:flex;
    flex-direction:column;
    gap:22px;
    align-items:stretch;
    padding:16px 20px 4px;
  }
  .day-column{
    display:flex;
    flex-direction:column;
    flex:1 1 auto;
    gap:10px;
  }
  .day-header{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    padding:14px;
  }
  .day-header .d-name{ font-size:15px; font-weight:700; }
  .day-header .d-flag{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    padding:3px 8px;
    border-radius:6px;
    text-transform:uppercase;
  }
  .flag-ok{ background:rgba(127,184,138,0.18); color:var(--ok); }
  .flag-over{ background:rgba(217,102,91,0.18); color:var(--danger); }
  .flag-locked{ background:rgba(94,114,181,0.2); color:#9FB0E8; }

  .time-block{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:64px;
    padding:12px;
    border-radius:var(--radius-md);
    border:1px dashed var(--line-strong);
    background:rgba(237,231,218,0.02);
  }
  .time-block.locked{ border-style:solid; opacity:0.85; }
  .block-label{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
  }
  .block-label .name{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .block-label .mins{
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--paper-dim);
  }
  .block-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }

  .mini-task{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    padding:9px 8px 9px 10px;
    border-radius:9px;
    background:rgba(237,231,218,0.06);
    border:1px solid var(--line);
    font-size:12.5px;
  }
  .mini-task .mt-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .mini-task .mt-size{ font-family:'Space Mono', monospace; color:var(--paper-dim); flex-shrink:0; }
  .add-to-block{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:8px;
    border-radius:9px;
    border:1px dashed var(--line-strong);
    color:var(--paper-dim);
    font-size:12px;
    cursor:pointer;
  }

  /* ---------- Execution ---------- */
  .day-selector{
    display:flex;
    flex-direction:row;
    gap:8px;
    overflow-x:auto;
    padding:0 20px;
  }
  .day-pill{
    flex-shrink:0;
    padding:8px 14px;
    border-radius:12px;
    border:1px solid var(--line-strong);
    background:rgba(237,231,218,0.04);
    color:var(--paper-dim);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .day-pill.selected{ background:rgba(217,164,65,0.16); border-color:var(--gold); color:var(--gold); }
  .day-pill .lock-dot{ margin-left:5px; opacity:0.7; }

  .exec-header{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:20px;
  }
  .progress-bar-track{
    width:100%;
    height:8px;
    border-radius:6px;
    background:rgba(237,231,218,0.08);
    overflow:hidden;
  }
  .progress-bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--dawn), var(--gold));
    border-radius:6px;
    transition:width 0.4s ease;
  }

  .checklist-group{ display:flex; flex-direction:column; gap:8px; }
  .checklist-group-label{
    display:flex;
    align-items:center;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--paper-dim);
    padding:0 4px;
  }
  .checklist-row{
    display:flex;
    flex-direction:row;
    align-items:stretch;
    border-radius:var(--radius-md);
    background:rgba(237,231,218,0.045);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .checkbox-zone{
    display:flex;
    align-items:center;
    justify-content:center;
    width:60px;
    flex-shrink:0;
    border-right:1px solid var(--line);
  }
  .checkbox{
    width:26px;
    height:26px;
    border-radius:50%;
    border:2px solid var(--line-strong);
    display:flex;
    align-items:center;
    justify-content:center;
    color:transparent;
  }
  .checkbox.checked{
    background:var(--ok);
    border-color:var(--ok);
    color:#122016;
  }
  .task-details{
    display:flex;
    flex-direction:column;
    flex:1;
    justify-content:center;
    gap:4px;
    padding:12px 14px;
  }
  .task-details .td-title{ font-weight:600; font-size:14.5px; }
  .task-details.completed .td-title{ text-decoration:line-through; color:var(--paper-dim); }
  .td-meta{ display:flex; gap:8px; align-items:center; }

  /* ---------- Modal / sheet ---------- */
  .sheet-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,10,16,0.6);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
  }
  .sheet{
    width:100%;
    max-width:560px;
    background:#20233A;
    border:1px solid var(--line-strong);
    border-radius:24px 24px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:14px;
    max-height:82vh;
    overflow-y:auto;
    box-shadow:0 -8px 40px rgba(0,0,0,0.5);
  }
  .sheet-handle{
    width:36px;
    height:4px;
    border-radius:4px;
    background:var(--line-strong);
    margin:0 auto 4px;
  }
  .sheet h2{ margin:0; font-size:19px; }
  .sheet-sub{ color:var(--paper-dim); font-size:13px; margin-top:-10px; }

  .focus-overlay{
    position:fixed;
    inset:0;
    background:radial-gradient(900px 700px at 50% 20%, #262A44 0%, var(--ink) 70%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:26px;
    z-index:200;
    padding:24px;
    text-align:center;
  }
  .focus-timer{
    font-family:'Space Mono', monospace;
    font-size:64px;
    font-weight:700;
    letter-spacing:0.02em;
  }
  .focus-actions{ display:flex; flex-direction:row; gap:12px; }

  .toast{
    position:fixed;
    left:50%;
    bottom:110px;
    transform:translateX(-50%);
    background:#2A2D46;
    border:1px solid var(--line-strong);
    color:var(--paper);
    padding:10px 18px;
    border-radius:12px;
    font-size:13px;
    box-shadow:var(--shadow-glass);
    z-index:150;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  .fab{
    position:fixed;
    right:calc(50% - 280px + 20px);
    bottom:112px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--gold), var(--dawn));
    color:#181A26;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    box-shadow:0 8px 24px rgba(217,164,65,0.35);
    cursor:pointer;
    z-index:35;
  }
  @media (max-width:559px){
    .fab{ right:24px; }
  }

  a{ color:var(--gold); }

  ::-webkit-scrollbar{ height:0; width:0; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="app-container" id="app">
  <!-- rendered by JS -->
</div>

<div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";

  /* ============================================================
     CONSTANTS
     ============================================================ */
  const BLOCK_NAMES = ["Morning","Afternoon","Evening","Night"];
  const BLOCK_COLORS = { Morning:"var(--dawn)", Afternoon:"var(--gold)", Evening:"var(--dusk)", Night:"var(--night)" };
  const DEFAULT_DAY_CAP_MINUTES = 240;
  const HOUR_OPTIONS = [1,2,3,4];
  const SIZES = [ {label:"S", mins:15}, {label:"M", mins:30}, {label:"L", mins:60} ];

  function dailyCap(){
    return (state.sprint && state.sprint.dailyCapMinutes) || DEFAULT_DAY_CAP_MINUTES;
  }

  /* ============================================================
     INDEXEDDB PERSISTENCE
     ============================================================ */
  const DB_NAME = "learnloop-db";
  const STORE = "kv";
  let dbPromise = null;

  function openDB(){
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function idbGet(key){
    try{
      const db = await openDB();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readonly");
        const r = tx.objectStore(STORE).get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }catch(e){ console.warn("idbGet failed", e); return null; }
  }

  async function idbSet(key, value){
    try{
      const db = await openDB();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put(value, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }catch(e){ console.warn("idbSet failed", e); return false; }
  }

  let saveTimer = null;
  function persist(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { idbSet("state", state); }, 150);
  }

  /* ============================================================
     STATE
     ============================================================ */
  function freshState(){
    return {
      sprint: null,          // { goalTitle, duration, createdAt, days:[{blocks:{Morning:[ids],...}, isLocked}] }
      tasks: [],             // { id, title, category, size, isCompleted, assignedDay, assignedBlock }
      ui: { tab:"backlog", execDay:0 }
    };
  }

  let state = freshState();

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  function makeSprint(goalTitle, duration, dailyCapMinutes){
    const days = [];
    for (let i=0;i<duration;i++){
      days.push({ blocks:{ Morning:[], Afternoon:[], Evening:[], Night:[] }, isLocked:false });
    }
    return { goalTitle, duration, dailyCapMinutes, createdAt: Date.now(), days };
  }

  function dayMinutesUsed(dayIndex){
    const day = state.sprint.days[dayIndex];
    let total = 0;
    BLOCK_NAMES.forEach(b => {
      day.blocks[b].forEach(taskId => {
        const t = getTask(taskId);
        if (t) total += t.size;
      });
    });
    return total;
  }

  function blockMinutesUsed(dayIndex, blockName){
    const day = state.sprint.days[dayIndex];
    return day.blocks[blockName].reduce((sum, id) => {
      const t = getTask(id);
      return sum + (t ? t.size : 0);
    }, 0);
  }

  function getTask(id){ return state.tasks.find(t => t.id === id); }

  function unassignedTasks(){
    return state.tasks.filter(t => t.assignedDay === null || t.assignedDay === undefined);
  }

  function completedMinutesForDay(dayIndex){
    const day = state.sprint.days[dayIndex];
    let total = 0;
    BLOCK_NAMES.forEach(b => day.blocks[b].forEach(id => {
      const t = getTask(id);
      if (t && t.isCompleted) total += t.size;
    }));
    return total;
  }

    menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4 4L19 7"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    unlock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-1.8"/></svg>',
    repeat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',

  function repeatTask(taskId){
    const t = getTask(taskId);
    if (!t) return;
    state.tasks.push({
      id: uid(),
      title: t.title,
      category: t.category,
      size: t.size,
      isCompleted: false,
      assignedDay: null,
      assignedBlock: null
    });
    persist();
    render();
    showToast(`Added a repeat of "${t.title}" to the backlog`);
  }

  /* ============================================================
     CAPACITY RING (signature element)
     Renders segmented ring: 4 arcs (one per block), filled proportion
     to minutes-used vs a fair share, total ring reflects day cap.
     ============================================================ */
  function renderRing(dayIndex, size){
    size = size || 76;
    const stroke = size * 0.11;
    const r = (size - stroke) / 2;
    const cx = size/2, cy = size/2;
    const gapDeg = 7;
    const segDeg = (360 - gapDeg*4)/4;
    const colors = [ "var(--dawn)","var(--gold)","var(--dusk)","var(--night)" ];

    function polar(angleDeg){
      const rad = (angleDeg-90) * Math.PI/180;
      return [ cx + r*Math.cos(rad), cy + r*Math.sin(rad) ];
    }
    function arcPath(a0,a1){
      const [x0,y0] = polar(a0);
      const [x1,y1] = polar(a1);
      const large = (a1-a0) > 180 ? 1 : 0;
      return `M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
    }

    let paths = "";
    let start = 0;
    const total = state.sprint ? dayMinutesUsed(dayIndex) : 0;
    const cap = state.sprint ? dailyCap() : DEFAULT_DAY_CAP_MINUTES;
    BLOCK_NAMES.forEach((b,i) => {
      const a0 = start;
      const a1 = start + segDeg;
      start = a1 + gapDeg;
      const used = state.sprint ? blockMinutesUsed(dayIndex,b) : 0;
      const blockCap = cap / 4; // a single block's practical share for visual fill reference
      const frac = Math.max(0, Math.min(1, used / blockCap));
      // track
      paths += `<path d="${arcPath(a0,a1)}" stroke="rgba(237,231,218,0.10)" stroke-width="${stroke}" fill="none" stroke-linecap="round"/>`;
      // fill (proportional sub-arc)
      const filledEnd = a0 + segDeg*frac;
      if (frac > 0){
        paths += `<path d="${arcPath(a0,filledEnd)}" stroke="${colors[i]}" stroke-width="${stroke}" fill="none" stroke-linecap="round"/>`;
      }
    });

    return `
      <div class="ring-wrap" style="width:${size}px;height:${size}px;">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>
        <div class="ring-center">
          <span class="val" style="font-size:${size*0.2}px;">${total}</span>
          <span class="lbl" style="font-size:${size*0.11}px;">of ${cap}</span>
        </div>
      </div>`;
  }

  /* ============================================================
     ROOT RENDER
     ============================================================ */
  const app = document.getElementById("app");

  function render(){
    if (!state.sprint){
      app.innerHTML = renderOnboarding();
      bindOnboarding();
      return;
    }

    app.innerHTML = `
      ${renderTopbar()}
      <div class="main-content">
        ${state.ui.tab === "backlog" ? renderBacklog() : ""}
        ${state.ui.tab === "planner" ? renderPlanner() : ""}
        ${state.ui.tab === "execute" ? renderExecute() : ""}
      </div>
      ${renderBottomNav()}
    `;
    bindGlobal();
    if (state.ui.tab === "backlog") bindBacklog();
    if (state.ui.tab === "planner") bindPlanner();
    if (state.ui.tab === "execute") bindExecute();
  }

  /* ---------------- Onboarding ---------------- */
  function renderOnboarding(){
    return `
    <div class="onboarding">
      <div class="mark">${renderRing(-1, 92)}</div>
      <div>
        <h1>Every skill fits<br/>in a 7-day loop.</h1>
        <p class="sub">Name the goal, cap the sprint, and let cognitive limits — not willpower — set the pace.</p>

        <div class="duration-row" id="durationRow">
          ${[1,2,3,4,5,6,7].map(n => `<div class="duration-chip ${n===5?'selected':''}" data-n="${n}"><span class="n">${n}</span><span>day${n>1?'s':''}</span></div>`).join("")}
        </div>
      </div>
      <div class="field">
        <label>Hours dedicated per day</label>
        <div class="duration-row" id="hoursRow">
          ${HOUR_OPTIONS.map(h => `<div class="duration-chip ${h===2?'selected':''}" data-h="${h}"><span class="n">${h}</span><span>hr${h>1?'s':''}</span></div>`).join("")}
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="startSprintBtn">Start sprint</button>
    </div>`;
  }

  function bindOnboarding(){
    let selectedDuration = 5;
    let selectedHours = 2;
    const row = document.getElementById("durationRow");
    row.addEventListener("click", (e) => {
      const chip = e.target.closest(".duration-chip");
      if (!chip) return;
      selectedDuration = parseInt(chip.dataset.n, 10);
      [...row.children].forEach(c => c.classList.toggle("selected", c === chip));
    });
    const hoursRow = document.getElementById("hoursRow");
    hoursRow.addEventListener("click", (e) => {
      const chip = e.target.closest(".duration-chip");
      if (!chip) return;
      selectedHours = parseInt(chip.dataset.h, 10);
      [...hoursRow.children].forEach(c => c.classList.toggle("selected", c === chip));
    });
    document.getElementById("startSprintBtn").addEventListener("click", () => {
      const title = document.getElementById("goalInput").value.trim();
      if (!title){
        showToast("Give your sprint a goal first");
        return;
      }
      if (selectedDuration > 7){
        showToast("Break this into a smaller milestone — 7 days max");
        return;
      }
      state.sprint = makeSprint(title, selectedDuration, selectedHours * 60);
      state.ui.tab = "backlog";
      state.ui.execDay = 0;
      persist();
      render();
    });
  }

  /* ---------------- Topbar ---------------- */
  function renderTopbar(){
    const s = state.sprint;
    const dayLabel = `${s.duration}-day sprint`;
    return `
    <div class="topbar">
      <div class="goal-block">
        <span class="eyebrow">${dayLabel}</span>
        <h1>${escapeHtml(s.goalTitle)}</h1>
      </div>
      <div class="icon-btn" id="menuBtn">${ICONS.menu}</div>
    </div>`;
  }

  function bindGlobal(){
    const menuBtn = document.getElementById("menuBtn");
    if (menuBtn) menuBtn.addEventListener("click", openSprintMenu);
  }

  function openSprintMenu(){
    openSheet(`
      <div class="sheet-handle"></div>
      <h2>Sprint options</h2>
      <p class="sheet-sub">${escapeHtml(state.sprint.goalTitle)} · ${state.sprint.duration} day${state.sprint.duration>1?'s':''}</p>
      <button class="btn btn-danger btn-block" id="endSprintBtn">End sprint &amp; start over</button>
      <button class="btn btn-ghost btn-block" id="cancelMenuBtn">Cancel</button>
    `);
    document.getElementById("endSprintBtn").addEventListener("click", () => {
      closeSheet(() => {
        openSheet(`
          <div class="sheet-handle"></div>
          <h2>End this sprint?</h2>
          <p class="sheet-sub">This clears the goal, backlog, and schedule. This can't be undone.</p>
          <button class="btn btn-danger btn-block" id="confirmEndBtn">Yes, end it</button>
          <button class="btn btn-ghost btn-block" id="cancelEndBtn">Keep going</button>
        `);
        document.getElementById("confirmEndBtn").addEventListener("click", () => {
          state = freshState();
          persist();
          closeSheet(render);
        });
        document.getElementById("cancelEndBtn").addEventListener("click", () => closeSheet());
      });
    });
    document.getElementById("cancelMenuBtn").addEventListener("click", () => closeSheet());
  }

  /* ---------------- Bottom nav ---------------- */
  function renderBottomNav(){
    const tabs = [
      {id:"backlog", label:"Backlog", icon:ICONS.backlog},
      {id:"planner", label:"Planner", icon:ICONS.planner},
      {id:"execute", label:"Execute", icon:ICONS.execute},

    return `
    <div class="bottom-nav">
      ${tabs.map(t => `
        <button class="nav-btn ${state.ui.tab===t.id?'active':''}" data-tab="${t.id}">
          ${t.icon}
          <span>${t.label}</span>
        </button>`).join("")}
    </div>`;

  function bindBottomNav(){
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.ui.tab = btn.dataset.tab;
        render();
      });

  }

  /* ================================================================
     BACKLOG SCREEN
     ================================================================ */
  function renderBacklog(){
    const tasks = unassignedTasks();
    return `
    <div class="section">
      <div class="glass task-form">
        <div class="field">
          <label>Task</label>
          <input type="text" id="taskTitleInput" placeholder="e.g. Read hooks docs — useEffect" maxlength="100" />
        </div>
        <div class="field">
          <label>Objective type</label>
          <div class="toggle-row">
            <div class="toggle-btn primary selected" data-cat="primary">Primary</div>
            <div class="toggle-btn secondary" data-cat="secondary">Secondary</div>
          </div>
        </div>
        <div class="field">
          <label>Size (time-box)</label>
          <div class="size-row">
            ${SIZES.map((s,i) => `<div class="size-btn ${i===0?'selected':''}" data-size="${s.mins}"><span class="n">${s.mins}</span><span class="u">${s.label} · min</span></div>`).join("")}

  function taskCardHtml(t){
    return `
    <div class="task-card ${t.isCompleted?'completed':''}" data-id="${t.id}">
      <div class="task-main">
        <span class="task-title">${escapeHtml(t.title)}</span>

        <span>›</span>

  function bindBacklog(){
    let category = "primary";
    let size = SIZES[0].mins;

    document.querySelectorAll(".toggle-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        category = btn.dataset.cat;
        document.querySelectorAll(".toggle-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });
    document.querySelectorAll(".size-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        size = parseInt(btn.dataset.size, 10);
        document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });
    document.getElementById("addTaskBtn").addEventListener("click", () => {
      const input = document.getElementById("taskTitleInput");
      const title = input.value.trim();
      if (!title){ showToast("Name the task first"); return; }
      state.tasks.push({
        id: uid(), title, category, size,
        isCompleted:false, assignedDay:null, assignedBlock:null
      });
      persist();
      render();
    });

    document.querySelectorAll(".task-card").forEach(card => {
      card.addEventListener("click", () => openAssignSheet(card.dataset.id));
    });

    document.querySelectorAll(".task-card [data-repeat]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        repeatTask(btn.dataset.repeat);
      });

  /* ---------------- Assign sheet (Backlog -> Planner injection) ---------------- */
  function openAssignSheet(taskId){
    const task = getTask(taskId);
    if (!task) return;
    const duration = state.sprint.duration;

    function dayPicker(selectedDay){
      let html = `<div class="day-selector" id="assignDayRow" style="padding:0;">`;
      for (let i=0;i<duration;i++){
        const locked = state.sprint.days[i].isLocked;
        html += `<div class="day-pill ${selectedDay===i?'selected':''}" data-day="${i}">Day ${i+1}${locked?' 🔒':''}</div>`;
      }
      html += `</div>`;
      return html;
    }

    function blockPicker(dayIndex){
      return `<div style="display:flex;flex-direction:column;gap:8px;">
        ${BLOCK_NAMES.map(b => {
          const used = blockMinutesUsed(dayIndex, b);
          const dayUsed = dayMinutesUsed(dayIndex);
          const wouldExceed = (dayUsed + task.size) > dailyCap();
          const locked = state.sprint.days[dayIndex].isLocked;
          const disabled = locked || wouldExceed;
          return `<div class="add-to-block ${disabled?'':''}" data-block="${b}" data-day="${dayIndex}"
              style="justify-content:space-between;padding:12px 14px;opacity:${disabled?0.4:1};cursor:${disabled?'not-allowed':'pointer'};border-style:solid;">
            <span><span class="block-dot" style="background:${BLOCK_COLORS[b]}"></span>${b}</span>
            <span class="mono" style="color:var(--paper-dim);">${used}m${locked?' · locked':wouldExceed?' · full':''}</span>
          </div>`;
        }).join("")}
      </div>`;
    }

    let selectedDay = 0;
    while (selectedDay < duration && state.sprint.days[selectedDay].isLocked) selectedDay++;
    if (selectedDay >= duration) selectedDay = 0;

    function draw(){
      openSheet(`
        <div class="sheet-handle"></div>
        <h2>Schedule task</h2>
        <p class="sheet-sub">${escapeHtml(task.title)} · ${task.size}m</p>
        ${dayPicker(selectedDay)}
        ${blockPicker(selectedDay)}
        <button class="btn btn-ghost btn-block" id="removeAssignBtn">Cancel</button>
      `);
      document.getElementById("assignDayRow").addEventListener("click", (e) => {
        const pill = e.target.closest(".day-pill");
        if (!pill) return;
        selectedDay = parseInt(pill.dataset.day, 10);
        draw();
      });
      document.querySelectorAll(".add-to-block").forEach(el => {
        el.addEventListener("click", () => {
          const day = parseInt(el.dataset.day, 10);
          const block = el.dataset.block;
          if (state.sprint.days[day].isLocked){ showToast("That day is locked"); return; }
          const dayUsed = dayMinutesUsed(day);
          if (dayUsed + task.size > dailyCap()){ showToast(`Day is at your ${dailyCap()/60}-hour cap — overloaded`); return; }
          state.sprint.days[day].blocks[block].push(task.id);
          task.assignedDay = day;
          task.assignedBlock = block;
          persist();
          closeSheet(render);
          showToast(`Scheduled to Day ${day+1} · ${block}`);
        });
      });
      document.getElementById("removeAssignBtn").addEventListener("click", () => closeSheet());
    }
    draw();
  }

  /* ================================================================
     PLANNER SCREEN
     ================================================================ */
  function renderPlanner(){
    return `
    <div style="display:flex;flex-direction:column;gap:14px;padding-top:2px;">
      <div class="schedule-canvas" id="scheduleCanvas">
        ${state.sprint.days.map((day, i) => dayColumnHtml(i)).join("")}
      </div>
    </div>`;
  }

  function dayColumnHtml(dayIndex){
    const day = state.sprint.days[dayIndex];
    const used = dayMinutesUsed(dayIndex);
    const overloaded = used > dailyCap();
    let flag = day.isLocked ? `<span class="d-flag flag-locked">Locked</span>`
      : overloaded ? `<span class="d-flag flag-over">Overloaded</span>`
      : `<span class="d-flag flag-ok">${used}/${dailyCap()}m</span>`;

    return `
    <div class="day-column">
      <div class="glass day-header">
        <span class="d-name">Day ${dayIndex+1}</span>
        <div style="display:flex;align-items:center;gap:8px;">
          ${flag}
          <button class="icon-btn" style="width:32px;height:32px;" data-lock-toggle="${dayIndex}" title="${day.isLocked?'Unlock day':'Lock day'}">${day.isLocked?ICONS.lock:ICONS.unlock}</button>
        </div>
      </div>
      ${BLOCK_NAMES.map(b => blockHtml(dayIndex, b)).join("")}
    </div>`;
  }

  function blockHtml(dayIndex, blockName){
    const day = state.sprint.days[dayIndex];
    const ids = day.blocks[blockName];
    const mins = blockMinutesUsed(dayIndex, blockName);
    return `
    <div class="time-block ${day.isLocked?'locked':''}">
      <div class="block-label">
        <span class="name"><span class="block-dot" style="background:${BLOCK_COLORS[blockName]}"></span>${blockName}</span>
        <span class="mins">${mins}m</span>
      </div>
      ${ids.map(id => {
        const t = getTask(id);
        if (!t) return "";
        return `<div class="mini-task" data-day="${dayIndex}" data-block="${blockName}">
          <span class="mt-title" data-id="${t.id}" data-day="${dayIndex}" data-block="${blockName}">${escapeHtml(t.title)}</span>
          <span class="mt-size">${t.size}m</span>
          <button class="icon-btn" style="width:26px;height:26px;flex-shrink:0;" data-repeat="${t.id}" title="Add a repeat of this task">${ICONS.repeat}</button>
        </div>`;
      }).join("")}
      ${!day.isLocked ? `<div class="add-to-block" data-day="${dayIndex}" data-block="${blockName}">+ add task</div>` : ""}
    </div>`;
  }

  function bindPlanner(){
    document.querySelectorAll("[data-lock-toggle]").forEach(btn => {
      btn.addEventListener("click", () => {
        const dayIndex = parseInt(btn.dataset.lockToggle, 10);
        const day = state.sprint.days[dayIndex];
        day.isLocked = !day.isLocked;
        persist();
        render();
        showToast(day.isLocked ? `Day ${dayIndex+1} locked` : `Day ${dayIndex+1} unlocked — back to planning`);
      });
    });

    document.querySelectorAll(".mini-task .mt-title").forEach(el => {
      el.addEventListener("click", () => {
        const day = parseInt(el.dataset.day, 10);
        if (state.sprint.days[day].isLocked) { showToast("Locked days can't be edited"); return; }
        const block = el.dataset.block;
        const taskId = el.dataset.id;
        const arr = state.sprint.days[day].blocks[block];
        const idx = arr.indexOf(taskId);
        if (idx > -1) arr.splice(idx, 1);
        const t = getTask(taskId);
        if (t){ t.assignedDay = null; t.assignedBlock = null; }
        persist();
        render();
        showToast("Moved back to backlog");
      });
    });

    document.querySelectorAll(".time-block [data-repeat]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        repeatTask(btn.dataset.repeat);
      });
    });

    document.querySelectorAll(".day-column .add-to-block").forEach(el => {
      el.addEventListener("click", () => {
        const unassigned = unassignedTasks();
        if (unassigned.length === 0){ showToast("Backlog is empty — add a task first"); return; }
        openPickFromBacklog(parseInt(el.dataset.day,10), el.dataset.block);
      });
    });

    bindBottomNav();
  }

  function openPickFromBacklog(dayIndex, blockName){
    const unassigned = unassignedTasks();
    openSheet(`
      <div class="sheet-handle"></div>
      <h2>Add to ${blockName}</h2>
      <p class="sheet-sub">Day ${dayIndex+1} · ${blockMinutesUsed(dayIndex,blockName)}m in this block</p>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${unassigned.map(t => `
          <div class="task-card" data-pick="${t.id}">
            <div class="task-main">
              <span class="task-title">${escapeHtml(t.title)}</span>
              <div class="tag-row">
                <span class="tag ${t.category==='primary'?'tag-primary':'tag-secondary'}">${t.category}</span>
                <span class="tag tag-size">${t.size}m</span>
              </div>
            </div>
          </div>`).join("")}
      </div>
      <button class="btn btn-ghost btn-block" id="cancelPickBtn">Cancel</button>
    `);
    document.querySelectorAll("[data-pick]").forEach(card => {
      card.addEventListener("click", () => {
        const taskId = card.dataset.pick;
        const task = getTask(taskId);
        const dayUsed = dayMinutesUsed(dayIndex);
        if (dayUsed + task.size > dailyCap()){ showToast(`Day is at your ${dailyCap()/60}-hour cap — overloaded`); return; }
        state.sprint.days[dayIndex].blocks[blockName].push(taskId);
        task.assignedDay = dayIndex;
        task.assignedBlock = blockName;
        persist();
        closeSheet(render);
      });
    });
    document.getElementById("cancelPickBtn").addEventListener("click", () => closeSheet());
  }

  /* ================================================================
     EXECUTE SCREEN
     ================================================================ */
  function renderExecute(){
    const duration = state.sprint.duration;
    if (state.ui.execDay >= duration) state.ui.execDay = 0;
    const dayIndex = state.ui.execDay;
    const day = state.sprint.days[dayIndex];
    const totalScheduled = dayMinutesUsed(dayIndex);
    const totalCompleted = completedMinutesForDay(dayIndex);
    const pct = totalScheduled > 0 ? Math.round((totalCompleted/totalScheduled)*100) : 0;

    return `
    <div style="display:flex;flex-direction:column;gap:16px;padding-top:2px;">
      <div class="day-selector">
        ${state.sprint.days.map((d,i) => `<div class="day-pill ${i===dayIndex?'selected':''}" data-day="${i}">Day ${i+1}${d.isLocked?'<span class="lock-dot">🔒</span>':''}</div>`).join("")}
      </div>

      <div class="exec-header">
        ${renderRing(dayIndex, 96)}
        ${day.isLocked ? `
          <div style="width:100%;">
            <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
            <p style="text-align:center;color:var(--paper-dim);font-size:12.5px;margin:8px 0 0;">${pct}% complete · ${totalCompleted}/${totalScheduled}m done</p>
          </div>
          <button class="btn btn-ghost btn-block" id="unlockDayBtn">Unlock day &amp; go back to planning</button>
        ` : `
          <p class="sheet-sub" style="margin:0;">${totalScheduled}m scheduled across the day. Lock it in once the plan feels right.</p>
          <button class="btn btn-primary btn-block" id="lockDayBtn" ${totalScheduled===0?'disabled style="opacity:0.4;"':''}>Lock day &amp; start executing</button>
        `}
      </div>

      ${day.isLocked ? BLOCK_NAMES.map(b => execBlockGroup(dayIndex, b)).join("") : `
        <div class="empty-state">
          <div class="glyph">✎</div>
          <div class="t">Still planning</div>
          <div class="s">Head to the Planner tab to fill this day's blocks, then lock it here to enter checklist mode.</div>
        </div>
      `}
    </div>`;
  }

  function execBlockGroup(dayIndex, blockName){
    const ids = state.sprint.days[dayIndex].blocks[blockName];
    if (ids.length === 0) return "";
    return `
    <div class="checklist-group" style="padding:0 20px;">
      <div class="checklist-group-label"><span class="block-dot" style="background:${BLOCK_COLORS[blockName]}"></span>${blockName}</div>
      ${ids.map(id => {
        const t = getTask(id);
        if (!t) return "";
        return `
        <div class="checklist-row">
          <div class="checkbox-zone" data-check="${t.id}">
            <div class="checkbox ${t.isCompleted?'checked':''}">${t.isCompleted?ICONS.check:''}</div>
          </div>
          <div class="task-details ${t.isCompleted?'completed':''}" data-start="${t.id}">
            <span class="td-title">${escapeHtml(t.title)}</span>
            <div class="td-meta">
              <span class="tag ${t.category==='primary'?'tag-primary':'tag-secondary'}">${t.category}</span>
              <span class="tag tag-size">${t.size}m</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;padding-right:10px;">
            <button class="icon-btn" style="width:30px;height:30px;" data-repeat="${t.id}" title="Add a repeat of this task">${ICONS.repeat}</button>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  }

  function bindExecute(){
    document.querySelectorAll(".day-selector .day-pill").forEach(p => {
      p.addEventListener("click", () => {
        state.ui.execDay = parseInt(p.dataset.day, 10);
        render();
      });
    });

    const lockBtn = document.getElementById("lockDayBtn");
    if (lockBtn){
      lockBtn.addEventListener("click", () => {
        state.sprint.days[state.ui.execDay].isLocked = true;
        persist();
        render();
        showToast("Day locked. Time to execute.");
      });
    }

    const unlockBtn = document.getElementById("unlockDayBtn");
    if (unlockBtn){
      unlockBtn.addEventListener("click", () => {
        state.sprint.days[state.ui.execDay].isLocked = false;
        persist();
        render();
        showToast("Day unlocked — back to planning");
      });
    }

    document.querySelectorAll("[data-check]").forEach(el => {
      el.addEventListener("click", () => {
        const t = getTask(el.dataset.check);
        if (!t) return;
        t.isCompleted = !t.isCompleted;
        persist();
        render();
      });
    });

    document.querySelectorAll(".checklist-row [data-repeat]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        repeatTask(btn.dataset.repeat);
      });
    });

    document.querySelectorAll("[data-start]").forEach(el => {
      el.addEventListener("click", () => {
        const t = getTask(el.dataset.start);
        if (!t || t.isCompleted) return;
        openFocusTimer(t);
      });
    });

    bindBottomNav();
  }

  /* ---------------- Focus timer overlay ---------------- */
  let focusInterval = null;

  function openFocusTimer(task){
    let remaining = task.size * 60;
    let paused = false;

    const overlay = document.createElement("div");
    overlay.className = "focus-overlay";
    overlay.innerHTML = `
      <span class="eyebrow" style="color:var(--paper-dim);">${escapeHtml(task.title)}</span>
      <div class="focus-timer mono" id="focusClock">${formatClock(remaining)}</div>
      <div class="focus-actions">
        <button class="btn" id="focusPauseBtn">Pause</button>
        <button class="btn btn-danger" id="focusCancelBtn">Cancel</button>
      </div>
      <button class="btn btn-primary btn-block" id="focusDoneBtn" style="max-width:280px;">Mark complete</button>
    `;
    document.body.appendChild(overlay);

    function tick(){
      if (paused) return;
      remaining--;
      document.getElementById("focusClock").textContent = formatClock(Math.max(remaining,0));
      if (remaining <= 0){
        clearInterval(focusInterval);
        document.getElementById("focusClock").textContent = "Time's up";
        chime();
      }
    }
    focusInterval = setInterval(tick, 1000);

    document.getElementById("focusPauseBtn").addEventListener("click", (e) => {
      paused = !paused;
      e.target.textContent = paused ? "Resume" : "Pause";
    });
    document.getElementById("focusCancelBtn").addEventListener("click", closeFocus);
    document.getElementById("focusDoneBtn").addEventListener("click", () => {
      task.isCompleted = true;
      persist();
      closeFocus();
      render();
    });

    function closeFocus(){
      clearInterval(focusInterval);
      overlay.remove();
    }
  }

  function formatClock(totalSeconds){
    const m = Math.floor(totalSeconds/60);
    const s = totalSeconds % 60;
    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  function chime(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = 660;
      g.gain.value = 0.001;
      o.connect(g); g.connect(ctx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.9);
      o.stop(ctx.currentTime + 0.95);
    }catch(e){ /* audio not available, ignore */ }
  }

  /* ================================================================
     SHEET (bottom modal) HELPERS
     ================================================================ */
  function openSheet(innerHtml){
    let overlay = document.getElementById("sheetOverlay");
    if (overlay) overlay.remove();
    overlay = document.createElement("div");
    overlay.className = "sheet-overlay";
    overlay.id = "sheetOverlay";
    overlay.innerHTML = `<div class="sheet">${innerHtml}</div>`;
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeSheet();
    });
    document.body.appendChild(overlay);
  }

  function closeSheet(cb){
    const overlay = document.getElementById("sheetOverlay");
    if (overlay) overlay.remove();
    if (cb) cb();
  }

  /* ================================================================
     UTIL
     ================================================================ */
  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  /* ================================================================
     BOOT
     ================================================================ */
  async function boot(){
    const saved = await idbGet("state");
    if (saved) state = saved;
    render();

    if ("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  }

  boot();
})();
</script>
</body>
